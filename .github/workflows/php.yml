name: "PHP"

on:
  workflow_call:
  push:
    branches:
      - beta
    paths:
      - "**.php"
  pull_request:
    branches:
      - beta
      - master
    paths:
      - "**.php"

jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.3"
          coverage: none
          tools: none
      - name: Check PHP syntax
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l
